# NexusPurgatory
#
# Every effect below applies ONLY to players listed in `targets`, matched case-insensitively
# against their Java username and/or Xbox/Bedrock gamertag (Floodgate presents a Bedrock player's
# gamertag transparently as their in-game name, so one list covers both platforms -- no separate
# Bedrock section needed). A player not listed here is never touched by this plugin, full stop.
#
# To curse someone: add an entry below and run `/nexuspurgatory reload` (or restart). To release
# them: remove their entry and reload -- that's the plugin's entire "off switch." There is no
# in-game pardon command on purpose.
#
# targets:
#   - javaUsername: SomeJavaPlayerName
#   - xboxGamertag: SomeBedrockGamertag
#   - javaUsername: CanAlsoSetBoth
#     xboxGamertag: IfTheyPlayOnBothPlatforms
targets: []

health:
  # One heart. Bukkit clamps current health to this automatically, so it holds against any
  # regen source -- natural regen, potions, even a golden apple.
  capHealthPoints: 2.0

hunger:
  # How often (seconds) a cursed player's hunger is force-drained back down.
  drainIntervalSeconds: 45
  # The food-level it's drained TO each time (0-20). 1 keeps them just above instant starvation
  # damage from empty hunger, so the danger stays in the mob-damage and health-cap combo rather
  # than a flat, boring starvation tick.
  drainToLevel: 1

mobDamage:
  # Chance (0.0-1.0) that a landed hostile-mob hit (melee or a shot projectile) is amplified up
  # to at least their current health, i.e. lethal. 1.0 = every registered mob hit kills them.
  lethalityChance: 1.0

slowness:
  # Potion amplifier for the constant Slowness effect. 0 = Slowness I. Kept low by design --
  # this is meant to be a background annoyance, not the main event.
  amplifier: 0
  # How often (seconds) it's silently reapplied so it never has a moment to expire and flicker off.
  refreshIntervalSeconds: 5

inventory:
  # How often (seconds) a cursed player's main inventory + hotbar (not armor, not off-hand) gets
  # shuffled into a random order.
  jumbleIntervalSeconds: 45

itemDrain:
  # How often (seconds) the single most valuable item in a cursed player's inventory is deleted
  # outright. "Most valuable" is a rarity/power heuristic -- see README for exactly how it's
  # scored. Default: five minutes.
  intervalSeconds: 300
  # %item% is replaced with the deleted item's name (e.g. "Diamond Sword").
  tauntMessage: "&5&lYour %item% &5&lcrumbles to dust in your hands."

# Short, intermittent bursts of one extra random debuff (Nausea, Blindness, Mining Fatigue, or
# Weakness) layered on top of everything else above -- keeps the misery from becoming a static
# baseline a player could get numb to.
cursePulse:
  enabled: true
  intervalSeconds: 90
  durationSeconds: 5

# The longer someone stays online and cursed in one sitting, the worse curse-pulses get --
# "not so fast they rage quit, but absolutely to where they will." Escalation resets on logout;
# it is deliberately NOT remembered across sessions (see README).
escalation:
  enabled: true
  # Minutes of continuous cursed time before curse-pulses start landing more often. Each entry
  # is one more escalation stage.
  stageThresholdMinutes: [5, 15, 30]
  pulseIntervalReductionPerStageSeconds: 15
  minPulseIntervalSeconds: 20

# A small, always-visible boss bar shown only to the cursed player themselves -- a constant
# reminder this isn't a glitch and isn't stopping.
bossBar:
  enabled: true
  color: RED
  style: SEGMENTED_10
